<svg xmlns="http://www.w3.org/2000/svg" width="900" height="728" viewBox="0 32 900 728" font-family="'Songti SC','SimSun','Noto Serif CJK SC',serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a9199"/></marker></defs>
<rect x="0" y="32" width="900" height="728" fill="#ffffff"/>
<rect x="338.0" y="58.0" width="224.0" height="60.0" rx="5" fill="#ffffff" stroke="#1a1d21" stroke-width="1.4"/>
<text x="450.0" y="82.1" text-anchor="middle" font-size="14.0" fill="#1a1d21" font-weight="700">BOOT 自检</text>
<text x="450.0" y="103.8" text-anchor="middle" font-size="12.0" fill="#1a1d21" font-weight="700">初始化 INA219 校准寄存器</text>
<path d="M450,118 L450,158" fill="none" stroke="#8a9199" stroke-width="1.3" marker-end="url(#ar)"/>
<polygon points="450,162 640,236 450,310 260,236" fill="#f3f4f5" stroke="#1a1d21" stroke-width="1.5"/>
<text x="450.0" y="232.0" text-anchor="middle" font-size="14.5" fill="#1a1d21" font-weight="700">VBUS ≥ 4.5 V ?</text>
<text x="450.0" y="254.0" text-anchor="middle" font-size="12.0" fill="#4b5563">鼠标是否已通电</text>
<path d="M260,236 L176,236 L176,308" fill="none" stroke="#8a9199" stroke-width="1.3" marker-end="url(#ar)"/>
<text x="206.0" y="226.0" text-anchor="start" font-size="13.0" fill="#8f3a1a" font-weight="700">否</text>
<rect x="64.0" y="312.0" width="224.0" height="88.0" rx="5" fill="#ffffff" stroke="#1a1d21" stroke-width="1.4"/>
<text x="176.0" y="340.0" text-anchor="middle" font-size="14.0" fill="#1a1d21" font-weight="700">DEEP_SLEEP</text>
<text x="176.0" y="362.0" text-anchor="middle" font-size="12.0" fill="#1a1d21" font-weight="700">30 s 唤醒一次</text>
<text x="176.0" y="380.0" text-anchor="middle" font-size="12.0" fill="#1a1d21" font-weight="700">仅保留 VBUS 检测</text>
<path d="M640,236 L702,236 L702,308" fill="none" stroke="#8a9199" stroke-width="1.3" marker-end="url(#ar)"/>
<text x="660.0" y="226.0" text-anchor="start" font-size="13.0" fill="#1a1d21" font-weight="700">是</text>
<rect x="590.0" y="312.0" width="224.0" height="76.0" rx="5" fill="#ffffff" stroke="#1a1d21" stroke-width="1.4"/>
<text x="702.0" y="344.0" text-anchor="middle" font-size="14.0" fill="#1a1d21" font-weight="700">IDLE</text>
<text x="702.0" y="365.7" text-anchor="middle" font-size="12.0" fill="#1a1d21" font-weight="700">1 Hz 采 VBUS / I，等待事件</text>
<path d="M64,350 L30,350 L30,236 L256,236" fill="none" stroke="#8a9199" stroke-width="1.2" stroke-dasharray="5,4"/>
<path d="M30,236 L256,236" fill="none" stroke="#8a9199" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#ar)"/>
<text x="34.0" y="220.0" text-anchor="start" font-size="11.5" fill="#4b5563">VBUS 恢复</text>
<path d="M702,388 L702,436" fill="none" stroke="#8a9199" stroke-width="1.3" marker-end="url(#ar)"/>
<text x="688.0" y="416.0" text-anchor="end" font-size="11.5" fill="#4b5563">按键 / 滚轮中断，或 ΔI 超阈值</text>
<rect x="590.0" y="440.0" width="224.0" height="96.0" rx="5" fill="#ffffff" stroke="#1a1d21" stroke-width="1.4"/>
<text x="702.0" y="470.0" text-anchor="middle" font-size="13.5" fill="#1a1d21" font-weight="700">RECORDING</text>
<text x="702.0" y="492.0" text-anchor="middle" font-size="11.5" fill="#1a1d21" font-weight="700">20 Hz 采样 I / V / 事件</text>
<text x="702.0" y="510.0" text-anchor="middle" font-size="11.5" fill="#1a1d21" font-weight="700">环形缓冲 512 点</text>
<path d="M702,536 L702,566" fill="none" stroke="#8a9199" stroke-width="1.3" marker-end="url(#ar)"/>
<text x="688.0" y="556.0" text-anchor="end" font-size="11.5" fill="#4b5563">连续 5 s 无事件</text>
<rect x="590.0" y="570.0" width="224.0" height="74.0" rx="5" fill="#ffffff" stroke="#1a1d21" stroke-width="1.4"/>
<text x="702.0" y="601.3" text-anchor="middle" font-size="13.0" fill="#1a1d21" font-weight="700">FLUSH</text>
<text x="702.0" y="622.2" text-anchor="middle" font-size="11.0" fill="#1a1d21" font-weight="700">BLE 通知 / 串口输出一行 JSON</text>
<path d="M814,607 L862,607 L862,350 L818,350" fill="none" stroke="#8a9199" stroke-width="1.2"/>
<path d="M862,350 L818,350" fill="none" stroke="#8a9199" stroke-width="1.2" marker-end="url(#ar)"/>
<text x="870" y="482" font-size="11.5" fill="#4b5563" transform="rotate(90 870 482)">回到待机</text>
<text x="40.0" y="706.0" text-anchor="start" font-size="12.0" fill="#4b5563">输出字段与课题 02 的采样口径一致（时间戳 / 电压 mV / 电流 mA / 事件序列 / 工况标签），便于复用同一套分析脚本。</text>
<text x="40.0" y="732.0" text-anchor="start" font-size="12.0" fill="#4b5563">20 Hz 采样率对应 50 ms 周期，低于按键抖动时间尺度，可分辨单次点击与连点。</text>
</svg>
