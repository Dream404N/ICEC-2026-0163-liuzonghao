<svg xmlns="http://www.w3.org/2000/svg" width="900" height="548" viewBox="0 30 900 548" font-family="'Songti SC','SimSun','Noto Serif CJK SC',serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a9199"/></marker></defs>
<rect x="0" y="30" width="900" height="548" fill="#ffffff"/>
<rect x="46" y="56" width="808" height="158" rx="6" fill="none" stroke="#1a1d21" stroke-width="1.6"/>
<text x="62.0" y="80.0" text-anchor="start" font-size="13.0" fill="#4b5563" font-weight="700">主控板　210-001620_003　（2015.07.28）</text>
<rect x="86.0" y="98.0" width="128.0" height="48.0" rx="5" fill="#ffffff" stroke="#1a1d21" stroke-width="1.4"/>
<text x="150.0" y="126.7" text-anchor="middle" font-size="13.5" fill="#1a1d21" font-weight="700">USB 插头焊盘</text>
<path d="M214,122 L250,122" fill="none" stroke="#8a9199" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="254.0" y="98.0" width="92.0" height="48.0" rx="5" fill="#ffffff" stroke="#1a1d21" stroke-width="1.4"/>
<text x="300.0" y="116.5" text-anchor="middle" font-size="13.0" fill="#1a1d21">FB1</text>
<text x="300.0" y="136.6" text-anchor="middle" font-size="11.0" fill="#1a1d21">磁珠</text>
<path d="M346,122 L382,122" fill="none" stroke="#8a9199" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="386.0" y="98.0" width="96.0" height="48.0" rx="5" fill="#ffffff" stroke="#1a1d21" stroke-width="1.4"/>
<text x="434.0" y="116.5" text-anchor="middle" font-size="13.0" fill="#1a1d21">C6 / C7</text>
<text x="434.0" y="136.6" text-anchor="middle" font-size="11.0" fill="#1a1d21">去耦</text>
<path d="M482,122 L518,122" fill="none" stroke="#8a9199" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="522.0" y="98.0" width="130.0" height="48.0" rx="5" fill="#ffffff" stroke="#1a1d21" stroke-width="1.4"/>
<text x="587.0" y="126.7" text-anchor="middle" font-size="13.5" fill="#1a1d21" font-weight="700">LDO</text>
<path d="M652,122 L688,122" fill="none" stroke="#8a9199" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="692.0" y="98.0" width="128.0" height="48.0" rx="5" fill="#f3f4f5" stroke="#1a1d21" stroke-width="1.4"/>
<text x="756.0" y="126.7" text-anchor="middle" font-size="13.5" fill="#1a1d21" font-weight="700">3.3 V 轨</text>
<path d="M150,146 L150,176" fill="none" stroke="#8a9199" stroke-width="1.2"/>
<path d="M300,146 L300,176" fill="none" stroke="#8a9199" stroke-width="1.2"/>
<path d="M756,146 L756,176" fill="none" stroke="#8a9199" stroke-width="1.2"/>
<circle cx="150" cy="182" r="8" fill="#ffffff" stroke="#8f3a1a" stroke-width="1.6"/>
<circle cx="300" cy="182" r="8" fill="#ffffff" stroke="#8f3a1a" stroke-width="1.6"/>
<circle cx="756" cy="182" r="8" fill="#ffffff" stroke="#8f3a1a" stroke-width="1.6"/>
<text x="150.0" y="186.0" text-anchor="middle" font-size="11.0" fill="#8f3a1a" font-weight="700">A</text>
<text x="300.0" y="186.0" text-anchor="middle" font-size="11.0" fill="#8f3a1a" font-weight="700">B</text>
<text x="756.0" y="186.0" text-anchor="middle" font-size="11.0" fill="#8f3a1a" font-weight="700">C</text>
<path d="M470,146 L470,176" fill="none" stroke="#8a9199" stroke-width="1.2"/>
<circle cx="470" cy="182" r="8" fill="#ffffff" stroke="#8f3a1a" stroke-width="1.6"/>
<text x="470.0" y="186.0" text-anchor="middle" font-size="11.0" fill="#8f3a1a" font-weight="700">G</text>
<text x="62.0" y="246.0" text-anchor="start" font-size="12.5" fill="#1a1d21">A　VBUS 5 V，插头正极端子（最靠近源头，含整机全部负载）</text>
<text x="62.0" y="272.0" text-anchor="start" font-size="12.5" fill="#1a1d21">B　FB1 之后（已滤波，纹波更小，供新增采样板取电）</text>
<text x="62.0" y="298.0" text-anchor="start" font-size="12.5" fill="#1a1d21">C　3.3 V 轨（供 ESP32，省掉一级 LDO；仅覆盖 3.3 V 域，会漏 LDO 损耗）</text>
<text x="62.0" y="324.0" text-anchor="start" font-size="12.5" fill="#1a1d21">G　接地点：板边铺铜 / 螺丝孔焊盘（就近取，勿跨板走长地线）</text>
<rect x="46" y="346" width="530" height="112" rx="6" fill="none" stroke="#8a9199" stroke-width="1.2" stroke-dasharray="5,4"/>
<text x="60.0" y="368.0" text-anchor="start" font-size="12.5" fill="#1a1d21" font-weight="700">信号接入点（全部高阻，不改变原逻辑电平）</text>
<text x="60.0" y="392.0" text-anchor="start" font-size="12.0" fill="#4b5563">● TP5 / TP6 / TP12 / TP18 / TP19 —— 裸铜测试点，优先使用</text>
<text x="60.0" y="416.0" text-anchor="start" font-size="12.0" fill="#4b5563">● 按键分压节点（R 与 SW 之间）→ 串 100 kΩ 进 ADC</text>
<text x="60.0" y="440.0" text-anchor="start" font-size="12.0" fill="#4b5563">● 滚轮编码器 A/B 相 → 串 100 kΩ 接 GPIO 中断</text>
<rect x="596" y="346" width="258" height="112" rx="6" fill="#fdf7f4" stroke="#8f3a1a" stroke-width="1.2"/>
<text x="610.0" y="368.0" text-anchor="start" font-size="12.5" fill="#8f3a1a" font-weight="700">不做接入（会破坏原机功能）</text>
<text x="610.0" y="392.0" text-anchor="start" font-size="12.0" fill="#8f3a1a">✗ USB D+/D−（破坏枚举）</text>
<text x="610.0" y="416.0" text-anchor="start" font-size="12.0" fill="#8f3a1a">✗ CN1 传感器 FPC（丢帧）</text>
<text x="610.0" y="440.0" text-anchor="start" font-size="12.0" fill="#8f3a1a">✗ U1 的 NRST / BOOT（变砖）</text>
<text x="46.0" y="492.0" text-anchor="start" font-size="12.0" fill="#4b5563">取电点选择依据：A 点电流包含 MCU + 传感器 + LED 全部负载，是「整机功耗」的定义；B 点经 FB1 与 C6/C7 滤波，纹波更小。</text>
<text x="46.0" y="518.0" text-anchor="start" font-size="12.0" fill="#4b5563">原则：不改固件、不割线、不拆焊原器件；拆除增量电路后原机功能即恢复，不影响二次流通。</text>
<text x="46.0" y="550.0" text-anchor="start" font-size="12.0" fill="#8f3a1a">以上位置依据丝印与走线目视判定；焊接前须用万用表逐点确认电位，确认前不得上电。</text>
</svg>
