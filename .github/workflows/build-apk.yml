name: Build APK

on:
  push:
    branches: [ main ]
    paths:
      - 'tools/PowerProbe/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/PowerProbe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Ensure Android SDK components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
          fi
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Show outputs
        run: ls -lh app/build/outputs/apk/debug/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PowerProbe-debug-apk
          path: tools/PowerProbe/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: PowerProbe APK (latest)
          body: |
            由 GitHub Actions 自动构建的 debug APK，可直接安装到已 root 的测试机。

            安装：下载 `app-debug.apk` → 用文件管理器打开安装 → 首次运行授予 root 权限。
          files: tools/PowerProbe/app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
