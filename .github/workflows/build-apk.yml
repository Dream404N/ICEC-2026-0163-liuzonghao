name: Build APK

on:
  push:
    branches: [ main ]
    paths:
      - 'tools/PowerProbe/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/PowerProbe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Ensure Android SDK components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
          fi
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Show outputs
        run: ls -lh app/build/outputs/apk/debug/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PowerProbe-debug-apk
          path: tools/PowerProbe/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: PowerProbe APK (latest)
          body: |
            由 GitHub Actions 自动构建的 debug APK。

            **两种运行方式**
            - 无 root：全部走 Android 公共 API（BatteryManager / UsageStatsManager），可用；
            - 有 root：自动切到只读 sysfs + dumpsys，数据更细，并启用全自动（灭屏、翻页、切相机、截图存证）。

            **安全边界**（详见 `tools/PowerProbe/SECURITY.md`）
            - 命令不接受任何外部输入，全部是编译期常量；
            - 命中 `rm/mkfs/dd/mount/format/wipe/reboot` 等关键词直接拒绝执行；
            - 不申请设备管理器、不申请网络权限，数据全部本地。

            安装：下载 `app-debug.apk` → 允许安装未知来源 → 打开后按「权限与数据源」完成授权。
          files: tools/PowerProbe/app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
