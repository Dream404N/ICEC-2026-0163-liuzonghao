name: Build APK

on:
  push:
    branches: [ main ]
    paths:
      - 'tools/PowerProbe/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/PowerProbe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Ensure Android SDK components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
          fi
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Show outputs
        run: ls -lh app/build/outputs/apk/debug/

      - name: Verify signing certificate (must stay identical on every build)
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort | tail -1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk || true
          fi

      - name: Read versionName
        id: ver
        run: |
          V=$(sed -n 's/.*versionName[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle | head -1)
          if [ -z "$V" ]; then V="unknown"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "versionName=$V"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PowerProbe-debug-apk
          path: tools/PowerProbe/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish immutable build archive
        uses: softprops/action-gh-release@v3
        with:
          tag_name: apk-v${{ steps.ver.outputs.version }}-r${{ github.run_number }}
          name: 'PowerProbe v${{ steps.ver.outputs.version }} · build ${{ github.run_number }}'
          make_latest: 'false'
          body: |
            本次构建的**历史归档**，不会被后续构建覆盖。

            - versionName：v${{ steps.ver.outputs.version }}
            - 构建序号：#${{ github.run_number }}
            - 源码 commit：`${{ github.sha }}`
            - 签名：v1.5.0 起使用仓库内固定开发密钥，证书 SHA-256 由本轮 CI 日志打印
            - 最新可用版本请始终看 `apk-latest` 标签

            v1.4 及更早的构建每次 CI 换签名，旧 APK 与新版不兼容，
            若要安装须先卸载。归档主要用于留存迭代证据。
          files: tools/PowerProbe/app/build/outputs/apk/debug/app-debug.apk

      - name: Refresh apk-latest pointer
        uses: softprops/action-gh-release@v3
        with:
          tag_name: apk-latest
          name: PowerProbe APK (latest · v${{ steps.ver.outputs.version }})
          make_latest: 'true'
          body: |
            永远指向**最新一次成功构建**，每次自动覆盖本标签内的 `app-debug.apk`。
            完整历史版本请看 `apk-v*` 标签的归档 Release。

            本次：v${{ steps.ver.outputs.version }} / build #${{ github.run_number }} / `${{ github.sha }}`


            **v1.5.0：固定签名 + 数据不再丢**
            - 每次 CI 都用仓库内同一把开发密钥签名，可直接覆盖安装，不再需要卸载；
              ⚠ 已装 v1.4.0 及更早版本的用户**需要手动卸载一次**（这是最后一次），
              之后所有新版本都能直接覆盖安装，历史数据不再被清掉。
            - 采样点「即采即落盘」：每采一个点立刻追加写入 CSV 并镜像到
              `Download/PowerProbe/`，中途强杀 / 卸载 / 断电也不会丢已采数据；
            - 运行日志每行同步落盘到公共 Download，重装后 App 会自动把上次日志读回界面；
            - 实时文件名为 `T02_<工况>_<会话>_live.csv` 与 `T02_<会话>_log.txt`，
              与工况结束时的正式 CSV / 报告并存。

            **v1.4.0：KernelSU 风格的应用选择器**
            - 独立的「选择应用」页面，常驻搜索栏，输入即过滤应用名与包名；
            - 真实应用图标异步加载并缓存，当前选中项与推荐项（Phigros / 高德等）置顶标记；
            - 「显示系统应用」开关、长按复制包名、一键清除选择、可操作的空态提示。

            **已有能力**
            - 进程级性能指标：被测应用 CPU / PSS / 帧率 / 卡顿率 / P99 / 流量 / 大核频率 / 冷启动耗时，口径与 Emmagee、GT 一致；
            - 通知栏主控：进度条 + 工况倒计时 + 全程倒计时 + 实时读数 + 停止按钮；
            - 一键全自动四工况，自动拉起 Phigros 与系统相机并触发录像，自动翻页、截图存证；
            - CSV 33 列，设备端报告与分析脚本同步生成图表和统计检验。

            **两种运行方式**
            - 无 root：全部走 Android 公共 API（BatteryManager / UsageStatsManager），可用，但拿不到进程级指标；
            - 有 root：只读 sysfs + dumpsys，数据更细，并启用全自动编排。

            **安全边界**（详见 `tools/PowerProbe/SECURITY.md`）
            - 命令不接受任何外部输入，全部是编译期常量；
            - 命中 `rm/mkfs/dd/mount/format/wipe/reboot` 等关键词直接拒绝执行；
            - 不申请设备管理器、不申请网络权限，数据全部本地。

            安装：下载 `app-debug.apk` → 允许安装未知来源 → 打开后按「权限与数据源」完成授权。
            升级：v1.5.0 起签名固定，`adb install -r` 或直接覆盖安装即可，数据保留；
            从 v1.4.0 及更早版本升级时须先卸载一次（旧签名与新签名不兼容）。
            **必须人工的三件事**：插拔充电线、把 Phigros 画质帧率调到最高、现场同框照。
          files: tools/PowerProbe/app/build/outputs/apk/debug/app-debug.apk
