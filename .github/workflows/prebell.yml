name: prebell

# 定时不在这里。GitHub 的 schedule 最小粒度 5 分钟、高峰期排队能晚十几分钟，
# 拿它当闹钟是错配。闹钟在 cron-job.org：到点用 workflow_dispatch 把大节号踢进来，
# 这个 workflow 只负责执行、记账、出兜底产物。
#
# 三个 job（UTC，由 src/resolve.py 从课表反推，见 src/out/cron-hints.txt）：
#   period=1  北京 08:20  ->  20 0 * * 1,4        周一, 周四
#   period=3  北京 13:10  ->  10 5 * * 1,2,3,5     周一, 周二, 周三, 周五
#   period=4  北京 14:50  ->  50 6 * * 1,2,3,4     周一, 周二, 周三, 周四
# 一周共 10 次唤醒；没课的大节不配 job，本课程表只用 3 个大节。
# 课表变了先跑 python src/resolve.py，照 src/out/cron-hints.txt 改 cron-job.org。
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'round（默认正常一轮）| probe（连通性探测）| test-push（发一条测试消息）'
        required: false
        default: 'round'
      period:
        description: '大节号 1-4（cron-job.org 传入）；留空则按当前时刻判断该发哪一节'
        required: false
        default: ''
      source:
        description: '触发来源：cronjob / manual，写进日志备查'
        required: false
        default: 'manual'

permissions:
  contents: write

concurrency:
  group: prebell-round
  cancel-in-progress: false

env:
  # SendKey 只存在于仓库 Secrets；代码只读 os.environ，绝不入库。
  PREBELL_SENDKEY: ${{ secrets.PREBELL_SENDKEY }}

jobs:
  round:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Sync state before this round
        run: git pull --rebase origin ${{ github.ref_name }}

      - name: Run one PreBell round
        run: |
          set -o pipefail
          MODE="${{ github.event.inputs.mode || 'round' }}"
          PERIOD="${{ github.event.inputs.period }}"
          SOURCE="${{ github.event.inputs.source || 'manual' }}"
          SRC=02-20Days-Challenge/src/prebell.py
          case "$MODE" in
            probe)      python "$SRC" --probe     | tee /tmp/round.json ;;
            test-push)  python "$SRC" --test-push | tee /tmp/round.json ;;
            *)          python "$SRC" --period "$PERIOD" --source "$SOURCE" | tee /tmp/round.json ;;
          esac

      - name: Commit logs, state and fallback output
        run: |
          git config user.name "ICEC PreBell Bot"
          git config user.email "prebell@users.noreply.github.com"
          git add 02-20Days-Challenge/process_logs \
                  02-20Days-Challenge/state \
                  02-20Days-Challenge/public
          if git diff --staged --quiet; then
            echo "nothing new this round"
            exit 0
          fi
          MSG=$(python -c "
          import json
          d = json.load(open('/tmp/round.json'))
          m = 'prebell: %s %s' % (d['date'], d['minute'])
          if d.get('trigger_source'):
              m += ' src=' + d['trigger_source']
          if d.get('event'):
              m += ' ' + d['event']
          if d.get('reason'):
              m += ' ' + d['reason']
          if d.get('late_by_min') is not None and d['late_by_min'] > 0:
              m += ' late=%smin' % d['late_by_min']
          if d.get('hash'):
              m += ' chain=' + d['hash'][:8]
          if d.get('merkle_root'):
              m += ' merkle=' + d['merkle_root']
          print(m)
          ")
          git commit -m "$MSG"
          git push origin HEAD:${{ github.ref_name }}

      - name: Verify the whole chain
        run: python 02-20Days-Challenge/src/verify.py
