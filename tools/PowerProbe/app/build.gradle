plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.icec.powerprobe'
    compileSdk 34

    defaultConfig {
        applicationId "com.icec.powerprobe"
        minSdk 26
        targetSdk 33
        versionCode 5
        versionName "1.4.0"
    }

    buildTypes {
        debug {
            applicationIdSuffix ""
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // Material Components（Apache-2.0）：Material3 主题、卡片、动态取色（Monet）。
    // AppCompat（Apache-2.0）：AppCompatActivity 基类，Material3 主题要求。
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.12.0'
}
